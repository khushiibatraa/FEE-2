<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
    
        }
        .box{
            width: 60%;
            height: 400px;
            border: 2px solid red;
            display: grid;/*grid has no main and cross axis*/
            /* grid-template-columns: repeat(4,50px);  */
            grid-template-columns: 1fr 1fr 1fr 1fr; 
            grid-template-rows: repeat(3,1fr); 
            gap: 20px;

        }
        .childbox{
            border: 2px solid black;
            background-color: blueviolet;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="childbox">1</div>
        <div class="childbox">2</div>
        <div class="childbox">3</div>
        <div class="childbox">4</div>
        <div class="childbox">5</div>
        <div class="childbox">6</div>
        <div class="childbox">7</div>
        <div class="childbox">8</div>
        <div class="childbox">9</div>
    </div>
</body>
</html>
