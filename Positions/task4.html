<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
        .box{
            width: 400px;
            height: 400px;
            border: 2px solid red;
            position: relative;
            top: 20px;
            left: 50px;
        }
        .childbox{
            width: 50px;
            height: 50px;
            border: 2px solid black;
            background-color: blueviolet;
            /* position: absolute; absolute sets by default at start frm parent elemenr*/
        }
        </style>
</head>
<body>
    <div class="box">
        <div class="childbox"></div>
        <div class="childbox"></div>
        <div class="childbox"></div>
        <div class="childbox"></div>
        <div class="childbox"></div>
    </div>
</body>
</html>
